services:
  - type: web
    name: mp4-studio-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Set this to https://YOUR_GITHUB_USERNAME.github.io during blueprint setup.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MAX_VIDEO_MB
        value: "180"
      - key: MAX_DURATION_SECONDS
        value: "1200"
